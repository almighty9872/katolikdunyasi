var F1='<p>Marriage lasts for life, and a first marriage is presumed valid. A civil divorce, a civil annulment, an Islamic Talaq or Khula and a Jewish Get end the marriage in civil or religious law, but they do not end it in the Catholic Church (Catechism 1640 and 1650). Until the Church has resolved the former marriage, a new wedding or a convalidation is blocked. A person who remains single can still complete OCIA normally.</p>',
F3='<p>If a person is already living in a second union without an annulment, the pastor and a tribunal advocate review the first marriage before the second can be convalidated and before the sacraments. In some cases a couple may be permitted to receive the sacraments if they live together as brother and sister. The pastor will explain whether that applies.</p>',
DEC='<h3>Which decision applies</h3><ul><li><b>A Catholic who married outside the Church without a dispensation.</b> The marriage lacked canonical form, unless it was later convalidated or made valid by a radical sanation. This is usually settled by a short check of documents during marriage preparation, not by a trial. Gather the Catholic’s recent baptismal certificate, the marriage record and the divorce decree.</li><li><b>Two unbaptized spouses, one of whom enters OCIA, and the other will not live in peace with the Christian.</b> The Pauline Privilege (Canons 1143 to 1147). Once the convert is baptized, the former marriage is dissolved at the moment the new marriage is celebrated.</li><li><b>A marriage in which at least one spouse was never baptized, when the Pauline Privilege does not apply.</b> The Favor of the Faith, sometimes called the Petrine Privilege, granted by the Pope through the Dicastery for the Doctrine of the Faith.</li><li><b>A marriage that was never consummated, with at least one spouse baptized.</b> The Pope can dissolve it for a just cause (Canon 1142).</li><li><b>A marriage that ended only with a civil annulment.</b> A civil court’s annulment has no effect in Church law. The tribunal must still examine the marriage.</li><li><b>Any other marriage, including marriages of non-Catholics and marriages celebrated in the Church.</b> A petition for a declaration of nullity (Canons 1671 to 1682). When the nullity is evident and both spouses ask for it, or one asks with the consent of the other, the bishop can decide it in a briefer process (Canons 1683 to 1687). Collect the marriage certificate, the divorce decree and the names of witnesses.</li></ul>',
NC='<p>Only Catholics are bound to the Catholic form of marriage. Valid marriages of Protestants, Muslims, Jews, Hindus, Sikhs, Buddhists and unbaptized people are recognized as valid. Like every marriage, yours is presumed valid unless there was a serious defect, such as forced consent or an earlier marriage still in force (Canon 1060). A valid marriage becomes a sacrament when both spouses have a valid Christian baptism.</p>',
CA='<p>A baptized Catholic must marry before a priest or deacon with two witnesses, unless the bishop dispensed from that form (Canons 1108 and 1117). This holds even if the Catholic was never confirmed or had stopped practicing. One exception: from 1983 until 2010, when Pope Benedict XVI’s 2009 change to the law (<i>Omnium in mentem</i>) took effect, a Catholic who had left the Church by a formal act was not bound to the form. Tell your pastor if that applies to you.</p>',
EA='<p>If either of you belongs to an Eastern Catholic Church, such as the Ukrainian, Maronite or Melkite Church, the Code of Canons of the Eastern Churches and the eparchy’s own norms apply. An Eastern Catholic marriage requires the blessing of a priest, and a deacon cannot give it.</p>',
BAP='<p>The Church recognizes baptism with water in the name of the Father, and of the Son, and of the Holy Spirit. It does not recognize baptism in groups that deny the Trinity, such as the Latter-day Saints or Jehovah’s Witnesses.</p>',
COH='<p>The Church teaches that sexual union belongs inside marriage (Catechism 2350 and 2390). A common-law partnership, or a de facto union in Quebec, has effects in civil law, but it is not a marriage in the Church.</p>',
ORT='<p>The Catholic Church judges an Orthodox Christian’s marriage by the law of the Orthodox Churches, which requires the blessing of a priest for validity (Code of Canons of the Eastern Churches 781; <i>Dignitas Connubii</i>, article 4). An Orthodox wedding blessed by a priest is presumed valid and is already a sacrament when both spouses are baptized.</p>';
/* Outcome: tone, title, summary, steps, background (HTML), section */
var R={
o_single:['g','Clear to proceed','Never married means no marriage impediment to the sacraments.',['Tell your OCIA director that you have never been married.','Give your parish a Christian baptismal certificate. If you were never baptized, or belonged to a group whose baptism the Church does not recognize, such as the Latter-day Saints or Jehovah’s Witnesses, a birth certificate is enough.','Continue toward the Easter sacraments.'],'','single'],
o_widowed:['g','Clear to proceed','Death ends the marriage bond, so no annulment is needed.',['Give your parish a copy of your late spouse’s death certificate.','Continue through OCIA toward Easter.'],'','widowed'],
o_div_single:['g','Clear to proceed','No annulment is needed while you remain single.',['Give your parish the marriage certificate and the divorce decree.','No annulment is needed unless you plan to marry again. If you might, speak to your pastor early, because the former marriage has to be examined first.','Continue toward Easter.'],'<p>A civil divorce, an Islamic Talaq or Khula, or a Jewish Get does not stop an unmarried person from entering OCIA or receiving the sacraments.</p>','divorced'],
o_separated:['g','Still married, clear to proceed','Separation does not end a marriage, and it does not stop you from joining the Church.',['Tell your pastor about the separation and give your parish the marriage certificate.','Continue toward your Easter sacraments while you live apart.','In the Church you are still married, so do not begin a new relationship unless the Church later declares the marriage null or dissolves it. If you are Catholic and married outside the Church without permission, tell your pastor, because the marriage may be invalid for lack of form.','If you hope to reconcile, ask your pastor about support. If the separation is final and you might marry again, ask early about the earlier marriage.'],'<p>Spouses may live apart for a serious reason, such as danger to a spouse or the children, while the bond remains (Canons 1151 to 1155; Catechism 1649). If both of you were unbaptized when you married and your spouse left because of your faith, the Pauline Privilege may apply later.</p>','separated'],
o_missing:['r','Declaration of presumed death','A marriage ends only with death. When a spouse has disappeared, the bishop can declare the death presumed after a careful inquiry (Canon 1707).',['Bring your marriage certificate and any police, military, immigration or humanitarian records about the disappearance.','Gather statements from people who knew your spouse and the circumstances.','A civil declaration of death, or a long absence alone, is not enough: the bishop must reach moral certainty.','If you stay single, you can complete OCIA normally. Wait for the bishop’s decree before any new wedding.','If you are Catholic and married outside the Church without permission, tell your pastor, because the marriage may be invalid for lack of form and no declaration of death may be needed.'],'<p>If both of you were unbaptized when you married, the Pauline Privilege may also apply, and the bishop can dispense from asking the absent spouse when that is impossible.</p>'+F1,'missing'],
o_samesex:['o','Talk with your pastor','The Church teaches that marriage is the union of one man and one woman, so a same-sex civil marriage is not a marriage in the Church.',['You are welcome in OCIA. Meet your pastor privately and early.','Before the sacraments, a sexual relationship outside marriage ends. Your pastor can help you work out what that means for your home, your civil obligations and any children in your care.','Ask about spiritual direction and support for living chastely.','Keep attending Mass and OCIA.'],'<p>Every person is to be accepted with respect, compassion and sensitivity, and every person is called to chastity (Catechism 2358 and 2359). Since 2023 a priest may give a brief, spontaneous blessing to people who ask for it, including a couple, but the blessing never approves or blesses the union itself (<i>Fiducia supplicans</i>).</p>','samesex'],
o_plural:['o','Special rule for plural marriage','An unbaptized person with several unbaptized spouses keeps the first spouse after baptism, or another one if staying with the first is a hardship (Canon 1148).',['Speak in confidence with your pastor and your bishop early in OCIA.','If you keep your first spouse, that marriage is already valid and no new wedding is needed. If you keep a later spouse, marry in canonical form after baptism, with a dispensation for disparity of cult if that spouse remains unbaptized (Canon 1086).','Meet every duty of justice, housing and financial support toward the other spouses and the children.'],'<p>An unbaptized man who has several unbaptized wives and receives baptism may keep the one he married first. If staying with her is a hardship, he may keep one of the others, and he must separate justly from the rest. The same rule applies to a woman with several husbands.</p>','plural'],
o_coh:['o','Resolve this before Easter','Living together unmarried is settled before the Easter sacraments.',['Meet your priest or OCIA director right away and in private.','Choose a path with your priest: prepare to marry in the Church, live apart, or, where your priest agrees, live chastely under one roof while you prepare to marry.','Receive the sacraments once that is settled.'],COH,'cohabiting'],
o_eng_coh:['o','Marriage preparation and your home','You are preparing to marry, and the living arrangement is settled before the Easter sacraments.',['Meet your parish priest early. Dioceses often ask for six to twelve months before the wedding.','Complete the diocesan marriage preparation, with any permission for a mixed marriage or dispensation for disparity of cult.','Choose with your priest: live apart until the wedding, or, where he agrees, live chastely under one roof while you prepare.','If either of you belongs to an Eastern Catholic Church, plan the wedding with the priest of your Eastern parish.','Receive your sacraments once the arrangement is settled, ideally before the wedding.'],COH,'cohabiting'],
o_dissolved:['o','Convalidation needed','The earlier bond still existed on your wedding day, so your current marriage needs a convalidation or a radical sanation.',['Give your parish the rescript of the dissolution and your current marriage record.','Meet your pastor to arrange a convalidation. If your spouse will not take part in a Catholic ceremony, ask about radical sanation.','Complete marriage preparation and any needed permission for a mixed marriage or dispensation for disparity of cult.','Continue toward your Easter sacraments once that is settled.'],'<p>A dissolution ends a marriage that was valid, so the earlier bond lasted until the dissolution took effect. A declaration of nullity is different: it finds that the earlier marriage was never valid, so a later marriage is not blocked by it.</p>'+CA,'former','Claire in Sudbury married her husband civilly before the Pope dissolved his first marriage. Once the rescript arrived, they convalidated their marriage before her reception at Easter.'],
o_divrem:['r','Former marriage first','A first marriage is presumed valid until the Church decides otherwise.',['Meet your pastor privately and bring the earlier marriage certificate and the divorce papers.','Begin early, because the process takes time. Your pastor or a tribunal advocate tells you which decision applies.','Talk with your pastor about the living arrangement while the case is open.','Keep attending Mass and OCIA. Your reception, wedding or convalidation is scheduled when the decision arrives.'],F1+DEC,'former','Jordan in Hamilton lives with a partner whose first marriage ended in divorce. While the tribunal examines that marriage, Jordan stays in OCIA and works out the living arrangement with the pastor.'],
o_eng_clean:['o','Marriage preparation needed','Complete OCIA, then prepare for a Catholic wedding.',['Meet your parish priest well ahead of the wedding. Dioceses often ask for six to twelve months.','Complete the diocesan marriage preparation.','If your fiancé or fiancée is baptized in another church, ask for permission for a mixed marriage. If your partner is unbaptized, ask for a dispensation for disparity of cult. Your priest requests it, and the Catholic promises to keep the faith and to do all they can to raise the children Catholic (Canons 1086 and 1124 to 1125).','If neither of you is Catholic on the wedding day, as when the wedding comes before your reception and your partner is not Catholic, the Catholic form is not required. Tell your priest so the plan is clear.','If your partner is an Orthodox Christian, a priest, not a deacon, must assist at the wedding (Canon 1108 §3).','Ideally, receive your Easter sacraments before the wedding (Canon 1065).'],'','engaged'],
o_eng_widowed:['o','Marriage preparation needed','Death dissolved the first marriage, so you are free to marry.',['Give your parish the death certificate and the first marriage certificate.','Meet your parish priest well ahead of the wedding. Dioceses often ask for six to twelve months.','Complete the diocesan marriage preparation, with any permission for a mixed marriage or dispensation for disparity of cult.','Ideally, receive your Easter sacraments before the wedding (Canon 1065).'],'','engaged','Hannah in Regina was widowed six years ago and is engaged to a Catholic. She gives her parish the death certificate and her first marriage certificate, and the wedding is set for the summer after her reception at Easter.'],
o_eastern:['o','Eastern Catholic norms apply','The Eastern Catholic Churches follow their own Code and the eparchy’s norms.',['Meet the priest of your Eastern Catholic parish early.','Plan the wedding with a priest, because the blessing must come from him.','Complete the eparchy’s marriage preparation and any permission or dispensation it requires.','Ideally, receive your Easter sacraments before the wedding.'],EA,'engaged','Mark in Winnipeg is engaged to a Ukrainian Catholic. After his reception at Easter, they marry in her parish, where the priest blesses the marriage.'],
o_eng_prior:['r','Nullity first','A civil divorce does not end the first marriage in the Church.',['Do not book a venue or set a date until the former marriage is resolved.','Bring the marriage certificate and the divorce papers to your pastor and begin early, because the process takes time.','Ask your pastor how OCIA timing works during the tribunal process. If you live together, talk with your pastor about the living arrangement while the case is open.','Keep attending Mass and OCIA. The wedding is scheduled when the decision arrives.'],F1+DEC,'former','Sarah in Guelph is divorced from her first husband and engaged to a Catholic. She petitions for a declaration of nullity, and the couple sets a wedding date only after the decree arrives.'],
o_deathafter:['o','Convalidation needed','Your spouse’s earlier marriage, or your own, still existed on your wedding day, so your current marriage needs a convalidation or a radical sanation.',['Give your parish the death certificate, the earlier marriage certificate and your current marriage record.','Meet your pastor, who explains how you renew your consent. If your spouse will not take part in a Catholic ceremony, ask about radical sanation.','Complete marriage preparation and any needed permission for a mixed marriage or dispensation for disparity of cult.','Continue toward your Easter sacraments once that is settled.'],'<p>A marriage ends only at death, so the earlier bond lasted until that day and made a wedding before it invalid (Canon 1085). If the earlier marriage was itself invalid, for example because a Catholic married outside the Church without permission, it did not block your wedding. Your pastor checks this first. Now that the bond has ended, a new exchange of consent, or a radical sanation, makes your marriage valid.</p>'+CA,'widowed','Dana in Red Deer married her husband civilly while his first wife was still living. She died two years later. Before Dana’s baptism at Easter, the couple renews their consent before their priest.'],
o_resolved:['g','Free to marry','The Church has already resolved the earlier marriage, so it does not block a new wedding.',['Give your parish the decree of nullity or the rescript of dissolution, with the earlier marriage certificate.','Check the decree for a note forbidding a new marriage without the bishop’s permission. If there is one, your pastor asks for it to be lifted.','Meet your parish priest well ahead of the wedding. Dioceses often ask for six to twelve months.','Ideally, receive your Easter sacraments before the wedding (Canon 1065).'],'','engaged','Olivia in Halifax received a declaration of nullity for her first marriage before she began OCIA. She gives the decree to her parish, is received at Easter and marries her fiancé in the fall.'],
o_missing_div:['r','Missing former spouse','A former spouse who cannot be found does not stop the Church from examining the earlier marriage.',['Bring the marriage certificate, the divorce decree and any records of your search for your former spouse to your pastor.','The diocesan tribunal can hear a petition for nullity even when the other spouse cannot be found and takes no part (Canon 1592).','If both of you were unbaptized when you married, the Pauline Privilege may apply, and the bishop can dispense from asking the absent spouse when that is impossible (Canon 1144).','If you believe your former spouse has died, the bishop can instead declare the death presumed after an inquiry (Canon 1707).','If you stay single, you can complete OCIA normally. Wait for the decision before setting a wedding date.'],F1+DEC,'former','Kofi in Halifax divorced years ago and has no address for his former wife. The tribunal hears his petition for nullity without her, and he sets a wedding date once the decree arrives.'],
o_pauline:['r','Pauline Privilege','A marriage of two unbaptized people can be dissolved in favor of the faith when one of them is baptized (Canons 1143 to 1147).',['Meet your pastor and the diocesan tribunal early.','Gather proof that both of you were unbaptized when you married and that your former spouse is still unbaptized, with the marriage and divorce records.','The bishop must ask the unbaptized former spouse whether they wish to be baptized or at least live peacefully with you, unless he dispenses because asking is impossible or useless (Canons 1144 and 1145).','After your baptism, the former marriage is dissolved at the moment the new marriage is celebrated. If you are already civilly married to your current spouse, that new marriage is the convalidation of your union.'],'<p>The Pauline Privilege applies when both spouses were unbaptized when they married, one of them is baptized, and the other departs, that is, will not live in peace with the Christian. It belongs to the spouse who is baptized. If the earlier marriage belongs to someone who is not being baptized, ask about the Favor of the Faith or a declaration of nullity instead.</p>'+F1+F3,'former','Wei in Vancouver married another unbaptized person, who left after Wei began OCIA. After Wei’s baptism the bishop asks the former spouse whether they will live in peace, and Wei’s later marriage to a Catholic dissolves the first.'],
o_petrine:['r','Favor of the Faith','The Pope may dissolve, in favor of the faith, a marriage in which at least one spouse was never baptized, when the Pauline Privilege does not apply.',['Meet your pastor early. The diocesan tribunal prepares the petition.','Provide baptismal records, proof that the other spouse was never baptized, the marriage certificate and the divorce decree.','Keep attending Mass and OCIA while the petition is examined.','Wait for the Pope’s rescript before the new marriage is celebrated. If you are already civilly married to your current spouse, the new marriage is the convalidation of your union.'],'<p>This is sometimes called the Petrine Privilege. The Pope grants it through the Dicastery for the Doctrine of the Faith. It can apply when one spouse was baptized and the other never was, or when both were unbaptized and the Pauline Privilege does not apply. The marriage must not have been consummated after both spouses were baptized, there must be no hope of restoring married life, the petitioner must not have been the sole or main guilty cause of the breakup, and the person the petitioner intends to marry must not have caused the separation.</p>'+F1+F3,'former','Michelle in Burlington, a baptized Anglican, was married to a man who was never baptized. Now divorced and engaged to a Catholic, she asks the tribunal to petition the Pope for the Favor of the Faith.'],
o_nonconsum:['r','Papal dissolution','When at least one spouse was baptized, the Pope can dissolve a marriage that was never consummated for a just cause (Canon 1142).',['Speak privately with your pastor, who helps you petition the diocesan bishop. The bishop gathers the evidence and sends it to Rome (Canons 1697 to 1706).','Provide the marriage and divorce records and proof that the marriage was never consummated.','Wait for the Pope’s decision before any new wedding.'],'<p>If both spouses were unbaptized, ask about the Pauline Privilege or the Favor of the Faith instead.</p>'+F1,'former','Peter in Laval separated from his wife weeks after their wedding, and the marriage was never consummated. His pastor helps him petition the Pope for a dissolution before he marries again.'],
o_religious:['r','Nullity or privilege first','A Talaq, Khula or Get ends a marriage in religious law but not in the Catholic Church.',['Bring the marriage record and the divorce papers to your priest.','If you stay single, you can complete OCIA normally.','To marry, the diocesan tribunal examines nullity or a privilege such as the Pauline Privilege.','Wait for the decision before setting a date.'],F1+DEC+F3,'former'],
o_civilann:['r','Church review needed','A civil court’s annulment has no effect in Church law.',['Bring the marriage certificate and the annulment decree to your priest.','The diocesan tribunal examines the earlier marriage.','Keep attending Mass and OCIA, and wait for the decision before a wedding or convalidation.'],F1+DEC+F3,'former','Isabelle in Trois-Rivières obtained a civil annulment in court. Her parish explains that the tribunal must still examine the marriage before she can marry in the Church.'],
o_lackform:['r','Lack of form first','A Catholic who married outside the Church without a dispensation was not validly married. A short check of documents usually confirms this, without a trial.',['Ask your priest to confirm the lack of form. Depending on the diocese, the parish or the tribunal does it.','Gather the Catholic’s recent baptismal certificate, the marriage record and the divorce decree.','Once it is confirmed, an engaged couple completes marriage preparation and marries in the Church. A married couple convalidates their marriage before the sacraments, unless neither of them was Catholic at their own wedding, when it is usually valid already. Your priest confirms which applies.'],'<p>This does not apply when a Catholic married an Orthodox Christian before an Orthodox priest, because that marriage was valid, or when the marriage was later convalidated or made valid by a radical sanation. It may also not apply to a Catholic who had formally left the Church between 1983 and 2010. Your priest will check.</p>'+F1+F3,'former','Aaron in Fredericton is engaged to a woman whose first husband, a Catholic, married her at city hall without permission. A short check of documents confirms the lack of form, and the wedding goes ahead after Easter.'],
o_full:['r','Declaration of nullity first','The earlier marriage needs a petition for a declaration of nullity (Canons 1671 to 1687).',['Meet your priest or a tribunal advocate to begin the petition.','Collect the marriage certificate, the divorce decree and the names of witnesses.','Stay in OCIA while the case runs. When the decree arrives, your pastor confirms what your current marriage needs: a convalidation if either of you was Catholic and you married outside the Church, and usually nothing if neither of you was Catholic at the wedding.'],'<p>This applies to any other marriage, including marriages of non-Catholics and marriages celebrated in the Church.</p>'+F1+F3,'former','Tom in Barrie married his second wife civilly after his first marriage, celebrated in a Catholic church, ended in divorce. The tribunal hears his petition, and the couple convalidates their marriage after the decree.'],
o_one:['g','Presumed valid','Your marriage is presumed valid as a natural marriage, so no convalidation is needed.',['Give your parish the marriage certificate.','You receive Baptism, Confirmation and the Eucharist at Easter, and your spouse does not have to join.','If your spouse is baptized later, the marriage becomes sacramental with no second ceremony.'],NC,'nc','Ahmed in Surrey married his wife in a civil ceremony when neither was baptized or married before. He is baptized at the Easter Vigil, his wife does not join, and their marriage stays valid with no new ceremony.'],
o_both:['g','Presumed valid','Your marriage becomes a sacrament at the Easter Vigil, when you are both baptized.',['Give your parish the marriage certificate.','Do not schedule a convalidation.','You may ask your pastor for a simple blessing after the Easter Vigil.'],NC,'nc'],
o_prot:['g','Presumed valid','A valid natural marriage that becomes a sacrament when the unbaptized spouse is validly baptized.',['Give your parish the marriage certificate and the baptized spouse’s baptismal certificate.','Do not schedule a convalidation.','Continue toward your Easter sacraments.'],NC+BAP,'nc','Kevin in Kelowna, never baptized, married a Lutheran woman at a courthouse. When he is baptized at the Easter Vigil, their marriage becomes a sacrament with no new ceremony.'],
o_validnc:['g','Presumed valid','Your marriage is presumed valid and is already a sacrament.',['Give your parish the marriage certificate and both baptismal certificates.','Do not schedule a convalidation.','Continue toward your Easter sacraments. A simple blessing afterward is optional.'],NC+BAP+'<p>If either baptism was in a group whose baptism the Church does not recognize, the marriage is a valid natural marriage, and it becomes a sacrament when that spouse is validly baptized.</p>','nc','Ruth and James in Saskatoon married in their Baptist church. Ruth is received into the Catholic Church at Easter, and their marriage, already a sacrament, needs no new ceremony.'],
o_orthodox:['o','Orthodox norms apply','An Orthodox Christian’s marriage is judged by Orthodox law, which requires a priest’s blessing.',['Give your parish the marriage certificate and both baptismal certificates.','If an Orthodox priest blessed your wedding, the marriage is presumed valid and nothing more is needed.','If the wedding was civil only, it is generally invalid for lack of form, because Orthodox law requires a priest’s blessing. Your pastor confirms this and arranges a convalidation.','Continue toward your Easter sacraments once that is settled.'],ORT+NC,'nc','Elena in Toronto, a Romanian Orthodox Christian, married her Anglican husband before an Orthodox priest. She is received into the Catholic Church, and her marriage needs nothing more.'],
o_custom:['g','Presumed valid','If neither of you was Catholic, neither had a prior bond and both consented freely, the original ceremony is a valid natural marriage.',['Give your parish whatever record exists, including a later civil registration.','Do not schedule a convalidation.','Continue toward your Easter sacraments.'],NC,'nc','Joseph and Ama in Ottawa married in a customary ceremony in Ghana before either was baptized. With a later civil registration and statements from family, their marriage is recognized and they are baptized at Easter.'],
o_proxy:['o','Talk to your pastor','A proxy wedding can be valid when a proper mandate was freely given (Canon 1105). A marriage entered under grave fear or coercion is invalid (Canon 1103), and so is one entered by someone too immature to understand and give consent (Canons 1095 and 1096). For a Catholic, Church law also sets a minimum age of 16 for a man and 14 for a woman (Canon 1083).',['Meet your pastor privately and explain how the wedding happened.','If you consented freely and were old enough to understand marriage, nothing more is needed.','If you were forced, or married as a child or young teenager, talk to your pastor privately about the diocesan tribunal.'],NC,'nc','Farah in London, Ontario, married by proxy while her husband worked abroad, and she chose the marriage freely. Her pastor confirms that nothing more is needed.'],
o_docs:['o','Other proof is accepted','Refugees and immigrants are not turned away when records are lost or the archives cannot be reached.',['Tell your OCIA director and pastor that the records are lost or out of reach.','Give your pastor any immigration papers that show your marital status.','Add sworn statements from two witnesses who knew you abroad.','Baptism can be proved by one witness above suspicion, or by the sworn word of the person baptized if they were baptized as an adult, provided this harms no one (Canon 876).'],NC,'nc','Samuel in Montreal fled Eritrea without his marriage or baptism records. His pastor accepts his immigration papers and the sworn statements of people who knew him there.'],
o_valid_cath:['g','Presumed valid','A wedding in a Catholic church before a priest or deacon is presumed valid.',['Give your parish the marriage certificate, or a baptismal certificate with the marriage noted.','If one of you was unbaptized at the wedding, the parish confirms that a dispensation for disparity of cult was given, because without it the marriage is invalid (Canon 1086). If it is missing, your pastor arranges a convalidation or a radical sanation.','If either of you belonged to an Eastern Catholic or Orthodox Church and a deacon, not a priest, led the wedding, tell your pastor, because only a priest can validly assist at such a marriage (Canon 1108 §3).','Continue toward your Easter sacraments.'],CA,'cath','Laura in Victoria was baptized Catholic as a baby but never raised in the faith, and she married in her parish church before a priest. She receives Confirmation and first Communion at Easter with no change to her marriage.'],
o_valid_east:['g','Presumed valid','A wedding in an Eastern Catholic church, blessed by a priest, is presumed valid and follows the Eastern Churches’ own norms.',['Give your parish the marriage certificate, or a baptismal certificate with the marriage noted.','Continue toward your Easter sacraments.'],CA+EA,'cath','Megan in Edmonton, a baptized Anglican, married her Ukrainian Catholic husband in his parish church with a priest’s blessing. She is received into the Catholic Church at Easter, and the marriage needs nothing more.'],
o_valid_disp:['g','Presumed valid','With the bishop’s dispensation from the form, your wedding is presumed valid.',['Give your parish the marriage record and the record of the dispensation.','If one of you was unbaptized at the wedding, the record should also show a dispensation for disparity of cult, because without it the marriage is invalid (Canon 1086). If it is missing, your pastor arranges a convalidation or a radical sanation.','Continue toward your Easter sacraments.'],CA,'cath','Rachel in Toronto, a Catholic, married her Jewish husband at a hotel with the bishop’s dispensations for disparity of cult and from the form. He gives his OCIA director the marriage record and the dispensation, and the marriage becomes a sacrament at his baptism.'],
o_orth_cath:['g','Valid, though without permission','When a Catholic marries an Orthodox Christian before an Orthodox priest, the marriage is valid. The Catholic form was needed only for lawfulness (Canon 1127). The same holds for an Eastern Catholic (Code of Canons of the Eastern Churches 834 §2).',['Give your parish the marriage certificate and both baptismal certificates.','Tell your pastor the wedding took place without permission. No convalidation is needed.','Continue toward your Easter sacraments.'],ORT+CA,'cath','Nicole in Mississauga, baptized Catholic but never practicing, married her Greek Orthodox husband before an Orthodox priest without asking her bishop. The marriage is valid, and she completes OCIA at Easter without a convalidation.'],
o_conv:['o','Convalidation needed','The marriage lacks canonical form. When both spouses are willing, they renew their consent before a priest or deacon and two witnesses (Canons 1156 to 1160). If either of you is Eastern Catholic or Orthodox, a priest must assist (Canon 1108 §3).',['Meet your parish priest immediately, before Lent.','Gather a recent baptismal certificate for the Catholic spouse, the civil marriage record and the names of two witnesses.','Complete marriage preparation and obtain any needed permission for a mixed marriage or dispensation for disparity of cult.','Celebrate the convalidation before the sacraments.'],CA+'<p>A devotional blessing of the marriage does not replace convalidation. The priest can explain the difference.</p>','cath'],
o_sanation:['o','Radical sanation','The bishop can make the marriage valid without a new ceremony (Canons 1161 to 1165).',['Speak privately with your pastor, who asks the bishop for the sanation.','Confirm that neither of you has an unresolved prior marriage.','Include any needed dispensation in the request.','Receive your sacraments once the sanation is granted.'],CA+'<p>Radical sanation (<i>sanatio in radice</i>) is used when a spouse will not take part in a Catholic ceremony. The bishop makes the marriage valid provided that the consent of both spouses continues.</p>','cath','Ben in Kingston was baptized Catholic and married his wife at city hall. She will not take part in a Catholic ceremony, so the bishop grants a radical sanation and Ben receives his sacraments at Easter.'],
o_blessing:['o','A blessing is not enough','A devotional blessing does not make valid a marriage that lacked the Church’s form.',['Ask your priest to explain the difference between a blessing and convalidation.','For convalidation, gather a recent baptismal certificate for the Catholic spouse, the civil marriage record and the names of two witnesses.','Complete marriage preparation and any needed permission or dispensation.','Celebrate the convalidation before the sacraments. If your spouse will not take part, ask about radical sanation.'],CA,'cath','Carmen and Luis in Brandon asked only for a blessing of their civil marriage. Their priest explained that a convalidation was needed, and they celebrated it before Carmen’s Confirmation at Easter.']
};
var TERMS=[['Canonical form','The Church’s required way for a Catholic to marry: before the local bishop, the pastor, or a priest or deacon delegated by them, and two witnesses.'],['Convalidation','A renewal of consent in canonical form that makes an invalid marriage valid.'],['Radical sanation','The bishop’s act that makes an invalid marriage valid without a new ceremony.'],['Presumed valid','Every marriage is treated as valid until the contrary is proved (Canon 1060).'],['Dissolution','The ending of a marriage that was valid, by the Pauline Privilege, the Favor of the Faith or the Pope’s dissolution of an unconsummated marriage. It differs from a declaration of nullity.'],['Declaration of nullity','A tribunal’s finding that a marriage was never valid. It is often called an annulment. It does not make children illegitimate and does not deny that a real relationship existed.'],['Pauline Privilege and Petrine Privilege','Two ways the Church dissolves a marriage in which at least one spouse was never baptized, in favor of the faith.'],['Disparity of cult','A marriage between a Catholic and an unbaptized person. It needs a dispensation.'],['Mixed marriage','A marriage between a Catholic and a baptized non-Catholic. It needs the bishop’s permission.'],['Declaration of presumed death','The bishop’s decree, after an inquiry, that a missing spouse can be presumed dead (Canon 1707).']];
var TONE={g:'Clear',o:'Action needed',r:'Resolve first'};
var HINT='The Church presumes every marriage valid until the contrary is proved (Canon 1060), so most situations need only a few documents and one conversation. If you were baptized in another Christian church, you are not baptized again: you are received with a Profession of Faith, Confirmation and first Communion. An Orthodox Christian is received with a Profession of Faith alone.';
var m=document.getElementById('m'),bk=document.getElementById('back'),pr=document.getElementById('pr'),
/* full: every answer given, as [question id, answer index]; pos: how many of them apply to the screen shown.
   Each answer is a browser history entry ({n:pos}), so Back and the swipe-back gesture return one question. */
full=[],pos=0,clearing=0,KEY='vd-ocia-marriage-2',DAY=864e5,dep={};
function E(t,cl,x){var e=document.createElement(t);if(cl)e.className=cl;if(x!=null)e.textContent=x;return e}
function H(t,cl,h){var e=E(t,cl);e.innerHTML=h;return e}
function cur(){if(!pos)return 'start';var a=full[pos-1];return Q[a[0]].a[a[1]][1]}
/* the most questions still possible from a question, for "Question 3 of up to 6" */
function depth(id){if(!Q[id])return 0;if(dep[id]==null){dep[id]=1;dep[id]=1+Math.max.apply(null,Q[id].a.map(function(o){return depth(o[1])}))}return dep[id]}
function save(){try{if(full.length)localStorage.setItem(KEY,JSON.stringify({f:full,p:pos,t:Date.now()}));else localStorage.removeItem(KEY)}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null'),id='start';
  if(!s||!Array.isArray(s.f)||Date.now()-s.t>30*DAY)return null;
  for(var i=0;i<s.f.length;i++){var a=s.f[i];if(!Q[id]||a[0]!==id||!Q[id].a[a[1]])return null;id=Q[id].a[a[1]][1]}
  return s.f.length?{f:s.f,p:Math.max(0,Math.min(s.f.length,s.p|0))}:null}catch(e){return null}}
function answer(i){var id=cur();
  if(!(full[pos]&&full[pos][0]===id&&full[pos][1]===i)){full=full.slice(0,pos);full.push([id,i])}
  pos++;history.pushState({n:pos},'','#'+cur());save();show(1)}
function back(){if(pos)history.back()}
function restart(){if(full.length&&!confirm('Start over? Your answers will be cleared.'))return;
  if(pos){clearing=1;history.go(-pos)}else{full=[];save();show(1)}}
function resume(s){full=s.f;for(var n=1;n<=s.p;n++){pos=n;history.pushState({n:n},'','#'+cur())}save();show(1)}
window.addEventListener('popstate',function(e){var n=e.state&&typeof e.state.n==='number'?e.state.n:0;
  if(clearing){clearing=0;full=[]}
  pos=Math.min(n,full.length);if(pos!==n)history.replaceState({n:pos},'',pos?'#'+cur():location.pathname+location.search);
  save();show(1)});
function show(user,offer){
  m.textContent='';var id=cur(),q=Q[id],r=R[id],h;
  if(q){
    if(pos){var pv=E('button','prevq','‹ Previous question');pv.type='button';pv.onclick=back;m.appendChild(pv)}
    if(offer){var rb=E('div','resume'),lt=offer.f[offer.p-1],rt=E('p','',(R[Q[lt[0]].a[lt[1]][1]]?'You had reached your result.':'You were on question '+(offer.p+1)+'.')+' Your answers are saved on this device.'),rc=E('button','p','Continue'),rs=E('button','','Start over');
      rc.type=rs.type='button';rc.onclick=function(){resume(offer)};rs.onclick=function(){full=[];save();show(1)};
      rb.appendChild(rt);rb.appendChild(rc);rb.appendChild(rs);m.appendChild(rb)}
    m.appendChild(E('p','kick',pos?'Question '+(pos+1)+' of up to '+(pos+depth(id)):'Marriage Navigator'));
    h=E('h1','',q.q);m.appendChild(h);
    var a=E('ul','ans'),was=full[pos]&&full[pos][0]===id?full[pos][1]:-1;
    q.a.forEach(function(o,i){var li=E('li'),bt=E('button');bt.type='button';bt.appendChild(E('span','n',i+1));bt.appendChild(E('span','',o[0]));
      if(i===was){bt.className='was';bt.setAttribute('aria-pressed','true');bt.appendChild(E('em','',' Your answer'))}
      bt.onclick=function(){answer(i)};li.appendChild(bt);a.appendChild(li)});
    m.appendChild(a);
    if(!pos)m.appendChild(H('p','hint',HINT));
    pr.style.width=Math.round(pos/(pos+depth(id))*100)+'%';
    document.title='OCIA Marriage Navigator: '+q.q;
  }else if(r){
    var s=S[r[5]],w=E('section','res '+r[0]);
    var pv2=E('button','prevq','‹ Previous question');pv2.type='button';pv2.onclick=back;w.appendChild(pv2);
    w.appendChild(E('span','tag',TONE[r[0]]));
    h=E('h1','',r[1]);w.appendChild(h);
    w.appendChild(E('p','sum',r[2]));
    w.appendChild(E('h2','','What to do'));
    var l=E('ol','steps');r[3].forEach(function(x){l.appendChild(E('li','',x))});w.appendChild(l);
    if(r[4]){w.appendChild(E('h2','','Background'));w.appendChild(H('div','about',r[4]))}
    var ex=E('div','ex');ex.appendChild(E('p','kick','Example'));ex.appendChild(E('p','',r[6]||s[0]));w.appendChild(ex);
    w.appendChild(H('p','src','<b>Sources:</b> '+s[1]));
    w.appendChild(E('h2','','Your answers'));
    var ya=E('ol','yours');full.slice(0,pos).forEach(function(x,k){var li=E('li'),t=E('div');
      t.appendChild(E('span','yq',Q[x[0]].q));t.appendChild(E('b','',Q[x[0]].a[x[1]][0]));li.appendChild(t);
      var ch=E('button','',  'Change');ch.type='button';ch.setAttribute('aria-label','Change your answer to: '+Q[x[0]].q);
      ch.onclick=function(){history.go(k-pos)};li.appendChild(ch);ya.appendChild(li)});
    w.appendChild(ya);
    var d=E('details'),dl=E('dl');d.appendChild(E('summary','','Terms you will hear'));
    TERMS.forEach(function(t){dl.appendChild(E('dt','',t[0]));dl.appendChild(E('dd','',t[1]))});d.appendChild(dl);w.appendChild(d);
    var ac=E('div','acts'),pt=E('button','','Print or save as PDF'),st=E('button','','Start over');pt.type=st.type='button';pt.onclick=function(){window.print()};st.onclick=restart;
    var fl=E('a','p','More OCIA help');fl.href='/#ocia';ac.appendChild(pt);ac.appendChild(st);ac.appendChild(fl);w.appendChild(ac);
    m.appendChild(w);
    pr.style.width='100%';document.title='OCIA Marriage Navigator: '+r[1];
  }
  bk.disabled=!pos;
  if(user){window.scrollTo(0,0);h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
}
bk.onclick=back;
document.getElementById('again').onclick=restart;
window.addEventListener('beforeprint',function(){m.querySelectorAll('details').forEach(function(d){d.open=true})});
document.addEventListener('keydown',function(e){if(e.altKey||e.ctrlKey||e.metaKey)return;var n=parseInt(e.key,10),bs=m.querySelectorAll('.ans button');if(n>=1&&n<=bs.length)bs[n-1].click();else if(e.key==='ArrowLeft'||(e.key==='Backspace'&&!/INPUT|TEXTAREA/.test(e.target.tagName)))back()});
/* a reload keeps the history entry: carry on where it was. A new visit offers to continue saved answers. */
(function(){var s=load(),n=history.state&&typeof history.state.n==='number'?history.state.n:-1;
  if(s&&n>=0&&n<=s.f.length){full=s.f;pos=n;save();show(0);return}
  history.replaceState({n:0},'',location.pathname+location.search);
  if(s&&!s.p)full=s.f;show(0,s&&s.p?s:null)})();
})();
</script>
