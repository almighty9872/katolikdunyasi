<script>
(function(){
var Q={
start:{q:'What is your situation today?',a:[['Single, never married','o_single'],['Engaged to be married','eng'],['Living together, not married','coh'],['Married','poly'],['Divorced, and single now','div'],['Widowed, and single now','o_widowed']]},
poly:{q:'Do you have more than one spouse?',a:[['No, one husband and one wife','prior'],['Yes, plural marriage entered before baptism','o_plural']]},
coh:{q:'Has either of you been married before, with that marriage not resolved by the Church?',a:[['No, neither of us','o_coh'],['Yes, one or both of us','o_divrem']]},
eng:{q:'Has either of you been married before?',a:[['No, neither of us','eng_rite'],['Yes, and the former spouse is living','ending'],['Yes, and the former spouse has died','o_eng_widowed']]},
eng_rite:{q:'Is either of you in an Eastern Catholic Church?',a:[['No, a Latin (Roman) Catholic parish','o_eng_clean'],['Yes, such as Ukrainian, Maronite or Melkite','o_eastern']]},
ending:{q:'Which describes the earlier marriage?',a:[['Two unbaptized spouses, and the other will not live in peace with the one joining','o_pauline'],['One baptized non-Catholic and one unbaptized spouse','o_petrine'],['Never consummated','o_nonconsum'],['Ended by Talaq, Khula or a Jewish Get','o_religious'],['Ended by a civil annulment only','o_civilann'],['Ended by civil divorce','o_eng_prior']]},
div:{q:'Do you plan to marry again?',a:[['No, I will stay single','o_div_single'],['Yes, or I might','ending']]},
prior:{q:'Was either of you married before this marriage?',a:[['No, the first marriage for both','faith'],['Yes, and that spouse has died','faith'],['Yes, and that spouse is living','bond']]},
bond:{q:'Has the Catholic Church resolved every earlier marriage?',a:[['Yes, a declaration of nullity was granted for each','faith'],['No, it ended by Talaq, Khula or a Jewish Get','o_religious'],['No, only a civil annulment was granted','o_civilann'],['No, it ended in civil divorce with no Church review','form']]},
form:{q:'Which describes that earlier marriage?',a:[['A baptized Catholic married outside the Church without permission','o_lackform'],['Two unbaptized spouses, and the convert is in OCIA','o_pauline'],['One baptized non-Catholic and one unbaptized spouse','o_petrine'],['Something else, such as non-Catholics or a wedding in a Catholic church','o_full']]},
faith:{q:'When you married, was either of you a baptized Catholic?',a:[['No, neither of us','nc'],['Yes, at least one of us','venue']]},
nc:{q:'Which describes your wedding and baptisms?',a:[['Both unbaptized, and only one of us is in OCIA','o_one'],['Both unbaptized, and both of us are in OCIA','o_both'],['One baptized Protestant and one unbaptized','o_prot'],['Both validly baptized non-Catholic Christians','o_validnc'],['A customary or religious wedding abroad, with no civil papers','o_custom'],['A proxy wedding, or one under family pressure','o_proxy'],['My marriage or baptism papers are missing','o_docs']]},
venue:{q:'How was your wedding celebrated?',a:[['In a Catholic church before a priest or deacon','rite'],['Elsewhere, with a Catholic bishop’s permission','o_valid_disp'],['Elsewhere, with no permission, such as a courthouse, hall or non-Catholic church','blessing']]},
rite:{q:'Was the Catholic church Latin or Eastern?',a:[['Latin (Roman) Catholic','o_valid_cath'],['Eastern Catholic','o_eastern']]},
blessing:{q:'Which fits you best?',a:[['We are both willing to marry in the Church','o_conv'],['My spouse will not take part in a Catholic ceremony','o_sanation'],['We only want a blessing of our marriage','o_blessing']]}
};
var R={
o_single:['g','Clear to proceed','Never married means no marriage impediment to the sacraments.',['Tell your OCIA director that you have never been married.','Give your parish a baptismal certificate, or a birth certificate if you were never baptized.','Continue toward the Easter sacraments.']],
o_widowed:['g','Clear to proceed','Death ends the marriage bond, so no annulment is needed.',['Give your parish a copy of your late spouse’s death certificate.','Continue through OCIA toward Easter.']],
o_div_single:['g','Clear to proceed','A divorce does not stop a single person from joining the Church.',['Give your parish the marriage certificate and divorce decree.','No annulment is needed unless you later decide to marry again.','Continue toward Easter.']],
o_plural:['o','Special rule for plural marriage','An unbaptized man with several wives may keep one spouse after baptism (Canon 1148).',['Speak in confidence with your pastor and bishop early in OCIA.','Keep the first wife, or one other if that is a hardship, and separate justly from the rest.','After baptism, marry the chosen spouse in canonical form.','Meet every duty of support toward the other wives and the children.']],
o_coh:['o','Resolve this before Easter','Living together unmarried is settled before the Easter sacraments.',['Meet your priest or OCIA director privately, right away.','Choose to prepare for marriage in the Church, or to end the shared living arrangement.','Receive the sacraments once that is done.']],
o_divrem:['r','Former marriage first','A first marriage is presumed valid until the Church decides otherwise.',['Meet your pastor and a tribunal advocate privately.','Gather the earlier marriage certificate, divorce decree and witness names for a declaration of nullity.','Keep attending Mass and OCIA while the case is open.','Your reception or convalidation is scheduled once the decision arrives.']],
o_eng_clean:['o','Marriage preparation needed','Complete OCIA, then prepare for a Catholic wedding.',['Meet your parish priest six to twelve months before the wedding.','Complete the diocesan marriage preparation.','Your priest requests any needed permission for a mixed marriage or dispensation for disparity of cult.','Receive your Easter sacraments before the wedding.']],
o_eng_widowed:['o','Marriage preparation needed','Death ended the first marriage, so you are free to marry.',['Give your parish the death certificate and the first marriage certificate.','Begin diocesan marriage preparation well ahead of the wedding.']],
o_eastern:['o','Eastern Catholic rules apply','The Eastern Churches follow their own Code and eparchial norms.',['Meet the priest of your Eastern Catholic parish early.','An Eastern Catholic marriage needs a priest’s blessing, and a deacon cannot give it.','Complete the eparchy’s marriage preparation and any needed permissions.']],
o_eng_prior:['r','Nullity first','A civil divorce does not end the first marriage in the Church.',['Do not set a wedding date yet.','Ask your priest to begin a declaration of nullity for the earlier marriage.','Ask your pastor how OCIA timing works while the case is open.']],
o_pauline:['r','Pauline Privilege','It may dissolve a marriage between two unbaptized people when one is baptized (Canons 1143 to 1147).',['Meet your pastor and the diocesan tribunal early.','Prove that neither of you was baptized during the marriage.','The bishop asks the former spouse whether they will be baptized or live in peace, unless that is impossible or useless.','The marriage is dissolved when your new marriage is celebrated after your baptism.']],
o_petrine:['r','Favor of the Faith (Petrine Privilege)','The Pope may dissolve a marriage in which one spouse was never baptized.',['Your pastor and the tribunal prepare the petition.','Provide baptismal records, proof the other spouse was never baptized, and the marriage and divorce papers.','Wait for the Pope’s rescript before the new marriage is celebrated.']],
o_nonconsum:['r','Papal dissolution','A valid marriage that was never consummated can be dissolved for a just cause (Canon 1142).',['Speak privately with your pastor and the judicial vicar.','Gather the marriage and divorce records and proof of non-consummation.','Wait for the Pope’s decision before any new wedding.']],
o_religious:['r','Nullity or privilege first','A Talaq, Khula or Get does not end a marriage in the Catholic Church.',['Bring the marriage record and the divorce papers to your priest.','If you stay single, you can complete OCIA normally.','To marry, a tribunal examines nullity or a privilege such as the Pauline Privilege.','Wait for the decree before setting a date.']],
o_civilann:['r','Church review needed','A civil annulment has no effect in Church law.',['Bring the marriage certificate and annulment decree to your priest.','The diocesan tribunal examines the earlier marriage.','Wait for its decision before a wedding or convalidation.']],
o_lackform:['r','Lack of form first','A Catholic who married without the Church’s form often qualifies for a faster process (Canon 1688).',['Ask your priest to file a declaration of nullity for lack of form.','Provide the Catholic’s recent baptismal certificate, the marriage record and the divorce decree.','After the decree, complete preparation and convalidate your current marriage.']],
o_full:['r','Declaration of nullity first','The earlier marriage needs a full tribunal examination.',['Meet your priest or a tribunal advocate to begin the petition.','Collect the marriage certificate, divorce decree and witness names.','Stay in OCIA, then convalidate your current marriage once the decree arrives.']],
o_one:['g','Already valid','Your marriage is a valid natural marriage. No convalidation is needed.',['Give your parish the marriage certificate and confirm there was no earlier marriage.','You receive the sacraments at Easter. Your spouse need not join.','If your spouse is baptized later, the marriage becomes a sacrament with no second ceremony.']],
o_both:['g','Already valid','Your marriage becomes a sacrament when you are both baptized.',['Give your parish the marriage certificate and confirm there was no earlier marriage.','Do not schedule a convalidation.','At the Easter Vigil your marriage becomes a sacrament. A simple blessing afterward is optional.']],
o_prot:['g','Already valid','A valid natural marriage that becomes a sacrament when the unbaptized spouse is baptized.',['Give your parish the marriage certificate and the baptized spouse’s certificate.','Do not schedule a convalidation.','The marriage becomes sacramental when the unbaptized spouse is validly baptized.']],
o_validnc:['g','Already valid','Neither of you was bound to the Catholic form, so no convalidation is needed.',['Give your parish the marriage certificate and confirm there was no earlier marriage.','Where both baptisms are valid, your marriage is already a sacrament.','A simple blessing after Easter is optional.']],
o_custom:['g','Already valid','A customary or religious wedding is a valid natural marriage if neither of you was Catholic.',['Give your parish whatever record exists, including any later civil registration.','Confirm there was no earlier marriage.','Do not schedule a convalidation.']],
o_proxy:['o','Talk to your pastor','A proxy wedding can be valid. A marriage entered under grave fear is not (Canons 1103 and 1105).',['Meet your pastor privately and explain how the wedding happened.','If you both consented freely through a lawful proxy, nothing more is needed.','If you were forced, ask about the diocesan tribunal.']],
o_docs:['o','Other proof is accepted','Lost records do not stop you from joining.',['Tell your OCIA director and pastor that records are lost or out of reach.','Give any immigration papers that show your marital status.','Provide sworn statements from two witnesses who knew you abroad.']],
o_valid_cath:['g','Already valid','A Catholic wedding before a priest or deacon is valid.',['Give your parish the marriage certificate, or a baptismal certificate with the marriage noted.','Continue toward your Easter sacraments.']],
o_valid_disp:['g','Already valid','A bishop’s permission made your wedding valid.',['Give your parish the marriage record and the record of the dispensation.','Continue toward your Easter sacraments.']],
o_conv:['o','Convalidation needed','Renew your consent before a priest or deacon and two witnesses. This applies even if the Catholic spouse was never confirmed.',['Meet your priest right away, before Lent.','Gather a recent baptismal certificate, the marriage record and two witnesses.','Complete marriage preparation and any needed dispensation.','Celebrate the convalidation before the sacraments.']],
o_sanation:['o','Radical sanation','The bishop can make the marriage valid without a new ceremony (Canons 1161 to 1165).',['Speak privately with your pastor so he can petition the bishop.','Confirm there is no earlier marriage and that both spouses intend a lifelong marriage.','Include any needed dispensation in the request.','Receive your sacraments once it is granted.']],
o_blessing:['o','A blessing is not enough','Without the Church’s form, a blessing does not make the marriage valid.',['Ask your priest to explain the Rite of Convalidation.','Gather a recent baptismal certificate, the marriage record and two witnesses.','Celebrate the convalidation before the sacraments.']]
};
var m=document.getElementById('m'),bk=document.getElementById('back'),pr=document.getElementById('pr'),hist=[];
function E(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function go(id){
  m.textContent='';var q=Q[id],r=R[id];
  if(q){
    var h=E('h1','',q.q);m.appendChild(h);
    var a=E('div','ans'+(q.a.length>5?' two':''));
    q.a.forEach(function(o,i){var b=E('button');b.type='button';b.appendChild(E('b','',i+1));b.appendChild(E('span','',o[0]));b.onclick=function(){hist.push(id);go(o[1])};a.appendChild(b)});
    m.appendChild(a);pr.style.width=Math.min(90,(hist.length+1)*18)+'%';
    document.title='OCIA Marriage Navigator: '+q.q;
  }else if(r){
    var w=E('section','res '+r[0]);w.appendChild(E('span','tag',{g:'Clear',o:'Action needed',r:'Resolve first'}[r[0]]));
    w.appendChild(E('h1','',r[1]));w.appendChild(E('p','sum',r[2]));
    var l=E('ol','steps');r[3].forEach(function(s){l.appendChild(E('li','',s))});w.appendChild(l);
    var c=E('div','acts');var s=E('button','',  'Start over');s.type='button';s.onclick=reset;
    var a2=E('a','p','Back to Verbum Domini');a2.href='/#ocia-marriage';c.appendChild(s);c.appendChild(a2);w.appendChild(c);m.appendChild(w);
    pr.style.width='100%';document.title='OCIA Marriage Navigator: '+r[1];
  }
  bk.disabled=!hist.length;
}
function reset(){hist=[];go('start')}
bk.onclick=function(){if(hist.length)go(hist.pop())};
document.getElementById('again').onclick=reset;
document.addEventListener('keydown',function(e){var n=parseInt(e.key,10),b=m.querySelectorAll('.ans button');if(n>=1&&n<=b.length)b[n-1].click();else if(e.key==='Backspace'||e.key==='ArrowLeft')bk.click()});
go('start');
})();
