# Builds the English site (Verbum Domini, verbumdomini.ca) from verbumdomini/app/ (verbumdomini/tools/build-app.py), and
# publishes verbumdomini/_site_en/ to the Cloudflare Worker "verbumdomini"
# (config: verbumdomini/cloudflare/wrangler.jsonc), the blog (blog.jsonc) and the parish portal (parishes.jsonc). Runs when something in verbumdomini/ changes,
# and can also be started by hand from the Actions tab ("Run workflow").
#
# Repository secrets it needs: CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" token)
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy English site to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'verbumdomini/**'
      - '.github/workflows/deploy-english.yml'
  workflow_dispatch:

# The build and the publish run on separate machines: the Cloudflare token is only ever present in
# the publish job, which runs nothing but wrangler. Actions are pinned to a commit and npm packages
# to an exact version, so a moved tag or a new release cannot change what runs here.
permissions:
  contents: read

concurrency:
  group: english-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned Tailwind CSS (verbumdomini/package-lock.json)
        run: npm ci --prefix verbumdomini --ignore-scripts --no-audit --no-fund

      - name: Build the English site into verbumdomini/_site_en (from verbumdomini/app; Tailwind builds app.css)
        run: python3 verbumdomini/tools/build-app.py

      - name: Check the app script parses
        run: node --check verbumdomini/_site_en/app.js

      - name: Check the built HTML (fails the deploy on broken markup)
        run: npx --yes html-validate@9.7.1 --config verbumdomini/.htmlvalidate.json "verbumdomini/_site_en/*.html"

      - name: Check internal links and anchors
        run: python3 verbumdomini/tools/qa/app-links.py verbumdomini/_site_en | tee links.txt && grep -q 'total bad 0' links.txt

      - name: Build the blog into verbumdomini/_site_blog (from verbumdomini/blog-src)
        run: python3 verbumdomini/tools/blog.py

      - name: Check the blog's HTML
        run: npx --yes html-validate@9.7.1 --config verbumdomini/.htmlvalidate.json "verbumdomini/_site_blog/*.html"

      - name: Build the parish portal into verbumdomini/_site_parishes (from verbumdomini/parishes-src; uses app.css built above)
        run: python3 verbumdomini/tools/parishes.py

      - name: Check the parish portal's HTML and scripts
        run: |
          npx --yes html-validate@9.7.1 --config verbumdomini/.htmlvalidate.json "verbumdomini/_site_parishes/*.html" "verbumdomini/_site_parishes/embed/*.html"
          for f in verbumdomini/_site_parishes/js/*.js; do node --check "$f"; done

      - name: Hand the built parish portal to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-parishes
          path: verbumdomini/_site_parishes
          include-hidden-files: true
          retention-days: 1

      - name: Hand the built blog to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-blog
          path: verbumdomini/_site_blog
          include-hidden-files: true
          retention-days: 1

      - name: Hand the built site to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-en
          path: verbumdomini/_site_en
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the Worker scripts and their config
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: verbumdomini/cloudflare

      - name: Fetch the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-en
          path: verbumdomini/_site_en

      - name: Fetch the built blog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-blog
          path: verbumdomini/_site_blog

      - name: Fetch the built parish portal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-parishes
          path: verbumdomini/_site_parishes

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.155.0 deploy --config verbumdomini/cloudflare/wrangler.jsonc
          npx --yes wrangler@4.155.0 deploy --config verbumdomini/cloudflare/www.jsonc   # www.verbumdomini.ca redirect
          npx --yes wrangler@4.155.0 deploy --config verbumdomini/cloudflare/blog.jsonc  # blog.verbumdomini.ca
          # parishes.verbumdomini.ca: deployed once its D1 database exists (database_id set in parishes.jsonc; see that file)
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' verbumdomini/cloudflare/parishes.jsonc; then
            echo "::notice::parishes.jsonc has no D1 database_id yet; the parish portal was not deployed"
          else
            npx --yes wrangler@4.155.0 deploy --config verbumdomini/cloudflare/parishes.jsonc
          fi
